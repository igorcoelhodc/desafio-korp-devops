version: '3.8'

networks:
  korp_network:
    driver: bridge

services:
  http-server-desafio-korp:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: http-server-desafio-korp:latest
    container_name: http-server-desafio-korp
    networks:
      - korp_network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    networks:
      - korp_network
    depends_on:
      - http-server-desafio-korp

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - korp_network
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - korp_network